# DiscoveryDataAgent: frontend web (Next.js + shadcn) y DiscoveryDataAgent-API (FastAPI + agente).
#
#   docker compose up --build                      → http://localhost:3000
#   DISCOVERY_DATA_AGENT_DEMO=1 docker compose up --build    → servidor simulado (usuarios demo/analista, contraseña demo)
#
# El primer login (inventario vacío) registra el servidor SQL Server y el agente descubre sus esquemas desde Administración.
# Desde el contenedor, un SQL Server del equipo anfitrión es `host.docker.internal,1433` (TCP habilitado; las instancias
# con nombre necesitan un puerto fijo). La autenticación de Windows no está disponible dentro del contenedor.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        # runtime.lock: API, MCP, SQL Server y Bedrock. Para NVIDIA NIM, OpenAI, Claude u Ollama (desarrollo): requirements/dev.lock
        REQUIREMENTS: ${DISCOVERY_DATA_AGENT_REQUIREMENTS:-requirements/runtime.lock}
    environment:
      DISCOVERY_DATA_AGENT_DATA_ROOT: /app/data/catalog
      DISCOVERY_DATA_AGENT_INVENTORY: /app/data/inventory.yaml
      DISCOVERY_DATA_AGENT_AUDIT_DIR: /app/data/audit
      DISCOVERY_DATA_AGENT_CURATION_DIR: /app/data/curation
      # BD DiscoveryDataAgent (OP-02): con ella, catálogo y auditoría van a SQL Server; obligatoria con DISCOVERY_DATA_AGENT_ENV=qa|prod
      DISCOVERY_DATA_AGENT_DB: ${DISCOVERY_DATA_AGENT_DB:-}
      DISCOVERY_DATA_AGENT_MODELS: ${DISCOVERY_DATA_AGENT_MODELS:-}  # p. ej. /app/config/models.yaml (montar abajo)
      DISCOVERY_DATA_AGENT_ADMINS: ${DISCOVERY_DATA_AGENT_ADMINS:-}
      DISCOVERY_DATA_AGENT_DEMO: ${DISCOVERY_DATA_AGENT_DEMO:-0}
      DISCOVERY_DATA_AGENT_ALLOW_WINDOWS_AUTH: "0"
      DISCOVERY_DATA_AGENT_COOKIE_SECURE: ${DISCOVERY_DATA_AGENT_COOKIE_SECURE:-0}  # 1 detrás de HTTPS
      # qa | prod: la API no arranca con ajustes inseguros (docs/calidad-bancaria.md §4)
      DISCOVERY_DATA_AGENT_ENV: ${DISCOVERY_DATA_AGENT_ENV:-dev}
      DISCOVERY_DATA_AGENT_ADMINS_ONLY: ${DISCOVERY_DATA_AGENT_ADMINS_ONLY:-0}
      DISCOVERY_DATA_AGENT_SETUP_TOKEN: ${DISCOVERY_DATA_AGENT_SETUP_TOKEN:-}
      DISCOVERY_DATA_AGENT_CORS_ORIGINS: ${DISCOVERY_DATA_AGENT_CORS_ORIGINS:-http://localhost:3000}
      DISCOVERY_DATA_AGENT_PUBLIC_URL: ${DISCOVERY_DATA_AGENT_PUBLIC_URL:-}
      DISCOVERY_DATA_AGENT_MCP_HOSTS: ${DISCOVERY_DATA_AGENT_MCP_HOSTS:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - discovery-data-agent-data:/app/data
      # - ./config/models.yaml:/app/config/models.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # La API no se publica: solo la usa el frontend por la red interna.

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
      # Solo detrás de un proxy inverso propio (IIS, ALB) que añade la dirección del cliente a X-Forwarded-For; entonces
      # la API necesita además DISCOVERY_DATA_AGENT_TRUST_PROXY=1. Sin ese proxy, apagado: la cabecera la escribiría el cliente.
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-0}
    ports:
      - "${DISCOVERY_DATA_AGENT_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  discovery-data-agent-data:
