# Pruebas y compuerta de calidad en cada push y PR (docs/calidad-bancaria.md).
name: calidad

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias del sistema (pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - name: Instalar
        run: python -m pip install -e ".[api,mcp,dev,sqlserver]"
      - name: Pruebas
        run: python -m pytest -q
      - name: Compuerta de calidad
        run: python -m converdata.cli eval gate --out reports
      - name: Evidencia de la compuerta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compuerta-de-calidad
          path: reports/
          if-no-files-found: ignore
