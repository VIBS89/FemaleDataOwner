# Pruebas, compuerta de calidad y cadena de suministro en cada push y PR (docs/calidad-bancaria.md).
# Las acciones van fijadas por commit, no por etiqueta: una etiqueta se puede mover.
name: calidad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # cada lunes: una vulnerabilidad nueva en algo ya fijado se detecta aunque nadie haga push

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Dependencias del sistema (pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc
      - name: Instalar (versiones y hashes fijados)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/build.lock
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation --no-index -e .
      - name: Pruebas
        run: python -m pytest -q
      - name: Compuerta de calidad
        run: python -m discovery_data_agent.cli eval gate --out reports
      - name: Evidencia de la compuerta
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: compuerta-de-calidad
          path: reports/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipos y lint
        run: npx tsc --noEmit && npx eslint src --max-warnings=0
      - name: Compilar
        run: npm run build

  cadena-de-suministro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "26"
      - name: Herramientas de análisis (también con versiones y hashes fijados)
        # En bloque: en una sola línea, el `: ` de `:all: -r` es sintaxis de YAML y el archivo entero deja de ser válido.
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/tools.lock
      - name: Vulnerabilidades conocidas en las dependencias de Python que se despliegan
        run: pip-audit -r requirements/runtime.lock --require-hashes --disable-pip
      - name: Vulnerabilidades conocidas en las dependencias de la web que se despliegan
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Inventario de componentes (SBOM, CycloneDX)
        run: |
          mkdir -p sbom
          cyclonedx-py requirements requirements/runtime.lock --output-format JSON --output-file sbom/discovery-data-agent-api.cdx.json
          # --package-lock-only: este trabajo no instala node_modules, y sin el indicador npm sbom falla por dependencias ausentes.
          cd web && npm sbom --omit dev --sbom-format cyclonedx --package-lock-only > ../sbom/discovery-data-agent-web.cdx.json
      - name: Publicar el SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: sbom/
