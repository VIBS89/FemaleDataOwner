# Ajustes del DiscoverFlow (valores por defecto de converdata.config.Settings).
features:
  ask_flow: false          # cifras con plantilla fija (decisión 17). false: las preguntas de cifras se responden
                           # como descubrimiento (también CONVERDATA_ASK_FLOW=1)
  ask_llm_sql: false       # fase 1b: si la plantilla no puede (fechas, varias uniones, listados), un LLM (rol `coder`)
                           # escribe el T-SQL, validado y con los permisos del usuario (también CONVERDATA_ASK_LLM_SQL=1)
  ask_max_rows: 1000       # fase 1b: filas máximas por respuesta
audit:
  fail_open: false         # F11: fail-closed; true solo en desarrollo
discovery:
  k_columns: 50
  k_tables: 30
  k_knowledge: 30
  k_golden: 5
  rerank_max: 25
  expand_top: 5
  max_candidates: 3
  secondary_candidate_min: 0.5
  max_alternatives: 3
  min_relevance: 0.4
  gap_threshold: 0.6       # F22 paso 8: por debajo, knowledge_gap y "Preguntar al responsable"
  generated_only_cap: 0.6
  golden_similarity_min: 0.85
  weights: {relevance_llm: 0.35, retrieval: 0.25, evidence: 0.15, confirmation: 0.15, agreement: 0.10}
