# Gateway de LLM para la máquina del desarrollador: modelos de Ollama.
# Copiar a config/models.yaml. Ollama solo se permite con environment: local (regla de código);
# en un servidor, CONVERDATA_ENV=dev|qa|prod sobrescribe este valor y el gateway se niega a arrancar.
environment: local
data_mode: test

providers:
  ollama:
    base_url: http://localhost:11434
  nvidia_nim:
    enabled: false               # activar si quieres respaldo en NIM (requiere NVIDIA_API_KEY)
  bedrock:
    enabled: false

roles:
  # qwen3.6:35b-a3b (MoE, 3B activos): tool calling y salida estructurada; razonamiento apagado (F16).
  planner: {provider: ollama, model: "qwen3.6:35b-a3b", temperature: 0.0, reasoning: false, num_ctx: 16384}
  fast:    {provider: ollama, model: "qwen3.6:35b-a3b", temperature: 0.0, reasoning: false, num_ctx: 8192, max_tokens: 400}
  judge:   {provider: ollama, model: "qwen3.6:35b-a3b", temperature: 0.0, reasoning: false}
  # Sin modelo de embeddings local la búsqueda es solo léxica. Para la parte semántica:
  #   ollama pull bge-m3      (multilingüe, 1024 dimensiones = VECTOR(1024) de OP-02)
  # embed: {provider: ollama, model: bge-m3}

fallback: null
# fallback: {provider: nvidia_nim, models: {planner: meta/llama-3.3-70b-instruct, fast: meta/llama-3.1-8b-instruct}}
