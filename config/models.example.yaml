# Gateway de LLM (F16). Copiar a config/models.yaml (ignorado por git).
# Sin este archivo, `discovery-data-agent discover` corre en modo determinista.
#
# Cada rol elige proveedor y modelo. Cambiar de NVIDIA NIM a OpenAI, Claude o Bedrock es cambiar este archivo, sin
# tocar código. Tras cada cambio: `discovery-data-agent llm smoke` (cada rol debe devolver salida estructurada).

# test = solo datos ficticios. Con datos reales poner "real": el gateway se niega a arrancar si algún rol
# (o el respaldo) apunta a un proveedor con allowed_data: test (F17, OP-06).
data_mode: test

providers:
  nvidia_nim:
    enabled: true
    base_url: null               # null = https://integrate.api.nvidia.com/v1 ; NIM autoalojado: http://<host>:8000/v1
    api_key_env: NVIDIA_API_KEY  # clave nvapi-... ; no hace falta con un NIM autoalojado sin autenticación
    allowed_data: test           # la API alojada de NVIDIA es un tercero: solo datos de prueba
    timeout_s: 30                # tope por petición HTTP del chat; luego cuenta como timeout para el respaldo
  openai:
    enabled: false               # extra `openai` (pip install -e ".[openai]")
    base_url: null               # null = API de OpenAI; con una URL, cualquier servidor compatible con su API
    api_key_env: OPENAI_API_KEY
    allowed_data: test           # tercero: solo datos de prueba
    timeout_s: 30
  anthropic:
    enabled: false               # extra `anthropic`; Claude por la API de Anthropic
    api_key_env: ANTHROPIC_API_KEY
    allowed_data: test           # tercero: solo datos de prueba
    timeout_s: 60                # Claude piensa antes de responder: dar más margen que a un modelo pequeño
  bedrock:
    enabled: false               # activar cuando la cuenta AWS tenga Bedrock y IAM Roles Anywhere (OP-01)
    region: us-east-1
    allowed_data: real           # sin model invocation logging (F17)

# La fase 1a usa dos roles, que pueden apuntar al mismo modelo: planner (intención y orden) y fast (narrativa).
# `judge` es de la fase 1b. La búsqueda es léxica (PRD §13, decisión 9): no hay rol para ella.
#
# NVIDIA NIM, medido el 2026-11-22 en la API alojada con las tres llamadas del flujo (intención, orden, narrativa):
#   nvidia/nemotron-3.5-bolt-e4b        correcto, 2–5 s por llamada (el más rápido)
#   nvidia/nemotron-3-ultra-550b-a55b   correcto, 3–12 s por llamada (el más capaz)
#   minimaxai/minimax-m3.1-flash        correcto, 5–12 s por llamada
# No sirven: los que rechazan `guided_json` (mistral-large-4, kimi-k3.1-pro, nemotron-3.5-lightning, muse-glimmer)
# y los que agotan el tiempo (gemma-4-31b-it, glm-5.3-flash). `openai/gpt-oss-20b` ya no está en el catálogo.
# El catálogo cambia: listar con GET /v1/models y probar con `llm smoke` antes de cambiar un modelo aquí.
#
# Evaluación de descubrimiento (58 casos, BancosSQL, 2026-11-22). Con estos modelos conviene declarar solo `fast`:
#   sin modelo                                    Hit@1 98,0 %  Hit@3 98,0 %  p50 0,02 s
#   solo fast = nemotron-3.5-bolt-e4b (narrativa)  Hit@1 98,0 %  Hit@3 98,0 %  p50 0,9 s
#   planner + fast = nemotron-3.5-bolt-e4b         Hit@1 62,7 %  Hit@3 74,5 %  p50 6,2 s
#   planner + fast = nemotron-3-ultra-550b-a55b    Hit@1 64,7 %  Hit@3 66,7 %  p50 39 s
# Un rol que falta usa su camino determinista. Antes de activar `planner` con otro modelo o proveedor, medir con
# `discovery-data-agent eval discovery --root tests/fixtures/bancos --models config/models.yaml`.
roles:
  fast:    {provider: nvidia_nim, model: nvidia/nemotron-3-ultra-550b-a55b, temperature: 0.0, max_tokens: 400}
  # enrich: describe las tablas y columnas nuevas al refrescar el catálogo (sugerencias marcadas "sin revisar"). Necesita
  # una salida larga; medido el 2026-11-23: 7 tablas y 72 columnas en 26 s con este modelo.
  enrich:  {provider: nvidia_nim, model: nvidia/nemotron-3.5-bolt-e4b, temperature: 0.0, max_tokens: 4000}
  # planner: {provider: nvidia_nim, model: nvidia/nemotron-3.5-bolt-e4b, temperature: 0.0, max_tokens: 1024}

# Respaldo ante throttling / indisponibilidad / timeout (nunca por errores de contenido). Puede ser cualquier otro
# proveedor activo, o el mismo con otro modelo; con data_mode: real, también debe tener allowed_data: real.
# Aquí: si `ultra` agota el tiempo, responde `bolt`. El circuito es por proveedor: con 3 fallos en 60 s se apaga NIM
# entero y el chat sigue por su camino determinista.
fallback:
  provider: nvidia_nim
  models: {fast: nvidia/nemotron-3.5-bolt-e4b}
# fallback:
#   provider: anthropic
#   models: {planner: claude-opus-5-5, fast: claude-haiku-5-5}

circuit: {errors: 3, window_s: 60, open_s: 300}

# --- Perfiles elegibles en pantalla (Administración → Modelos de IA) --------------------------------------------
# Cada perfil es un juego completo de roles. El administrador elige uno sin editar este archivo; la elección se
# guarda al lado, en `models.yaml.active`. Con perfiles, el activo sustituye a `roles` de arriba. Las claves nunca se
# escriben aquí ni en pantalla: van en las variables de entorno de `api_key_env`.
# Roles: fast = redacta la respuesta, reformula la búsqueda y orienta al usuario · enrich = describe tablas nuevas.
active_profile: nvidia
profiles:
  nvidia:
    label: "NVIDIA NIM"
    description: "Nemotron en la API alojada de NVIDIA. Solo datos de prueba."
    roles:
      # Comparación del 2026-11-23 de los 13 modelos generativos de la API alojada de NVIDIA con las llamadas reales
      # del chat (reformular una pregunta de reporte, orientar sin resultados, redactar):
      #   nvidia/nemotron-3.5-bolt-e4b        6 de 6 correctas, 1,2 s de media; reportes 52 % Hit@1 a 2 s
      #   nvidia/nemotron-3-ultra-550b-a55b   5 de 6, 5–8 s; reformula con más detalle, pero bajo carga agota el tiempo y
      #                                       el circuito lo desconecta: reportes 36 % Hit@1
      #   nvidia/nemotron-3.5-super-vl-120b   solo pidiendo JSON en el mensaje (rechaza `guided_json`), 5 s, con timeouts
      # No sirven hoy: rechazan `guided_json` y no devuelven JSON por mensaje (nemotron-3.5-lightning, nano-omni), agotan
      # el tiempo (mistral-large-4, kimi-k3.1-pro, muse-glimmer, step-5-preview, gemma-4-31b, glm-5.3-flash,
      # minimax-m3.1-flash) o ya no están (gemma-3-12b). El catálogo cambia: repetir la medición antes de cambiar.
      #
      # Repetido el 2026-11-24 con los 15 generativos del catálogo. Completos (`fast` y `enrich` con `guided_json`):
      # bolt-e4b, ultra-550b y poolside/laguna-xs-2.1 (nuevo). Medidos uno tras otro, sin carga concurrente, con
      # `eval discovery --root tests/fixtures/bancos` (Hit@1 · p50):
      #                                     reportes+conocimiento (25)   chat (67)        base (58)
      #   sin modelo                        64 % · 0,05 s                97,8 % · 0,05 s  98,0 % · 0,05 s
      #   nvidia/nemotron-3.5-bolt-e4b      80 % · 1,9 s                 97,8 % · 1,8 s   98,0 % · 1,9 s
      #   poolside/laguna-xs-2.1            76 % · 1,8 s                 97,8 % · 1,6 s   98,0 % · 2,0 s
      #   nvidia/nemotron-3-ultra-550b-a55b 88 % · 9,4 s (p95 19 s)      97,8 % · 7,0 s   98,0 % · 8,5 s
      #     el mismo, sin razonamiento      84 % · 3,3 s (p95 6 s)       97,8 % · 2,2 s   98,0 %           ← elegido
      # `ultra` piensa antes de responder: con `max_tokens: 400` la redacción se queda sin espacio y vuelve vacía (el
      # chat mostraba la respuesta sin texto). El gateway apaga el razonamiento en NIM salvo `reasoning: true`
      # (F16): 4 puntos menos que pensando, pero redacta siempre y tarda un tercio. Sigue por encima de `bolt` en
      # reportes, sin fugas ni inventados. Si la latencia pesa más que esos puntos, volver a `bolt`. La API alojada
      # devuelve 429 tras muchas llamadas seguidas y algún 400 de `guided_json`: el respaldo y el circuito los cubren.
      fast:   {provider: nvidia_nim, model: nvidia/nemotron-3-ultra-550b-a55b, temperature: 0.0, max_tokens: 400}
      # Medido el 2026-11-23 describiendo 7 tablas y 72 columnas: este modelo, 7 de 7 en 26 s; el grande
      # (nemotron-3-ultra-550b-a55b), 6 de 7 en 101 s con un error intermitente; Claude Sonnet 5.5, 7 de 7 en 32 s.
      # Repetido el 2026-11-24 con el catálogo real de BancosSQL (71 objetos, 652 columnas): este modelo describe
      # 70 objetos y el 94 % de las columnas (8 avisos, 18 min); `ultra`, 70 objetos y solo el 76 % de las columnas
      # (4 avisos, 20 min). Sigue este. Los avisos son rechazos intermitentes de `guided_json` de la API alojada.
      enrich: {provider: nvidia_nim, model: nvidia/nemotron-3.5-bolt-e4b, temperature: 0.0, max_tokens: 4000}
  claude:
    label: "Claude (Anthropic)"
    description: "Claude Sonnet 5.5 por la API de Anthropic. Solo datos de prueba."
    roles:
      fast:   {provider: anthropic, model: claude-sonnet-5-5, effort: low, max_tokens: 4000}
      enrich: {provider: anthropic, model: claude-sonnet-5-5, effort: low, max_tokens: 16000}

# --- Claude (API de Anthropic) como principal ---
# providers: {anthropic: {enabled: true, api_key_env: ANTHROPIC_API_KEY, timeout_s: 60}}
# roles:
#   # Sin `temperature`: los modelos actuales de Claude la rechazan; la profundidad se regula con `effort`
#   # (low | medium | high | xhigh | max). El pensamiento cuenta dentro de `max_tokens`: no bajar de unos miles.
#   # refusal_fallback: ante un rechazo por política, la API repite la petición en otro modelo de Claude
#   # (lo admiten Opus 5.5, Sonnet 5.5 y Fable; no Haiku).
#   planner: {provider: anthropic, model: claude-opus-5-5, effort: low, max_tokens: 8000, refusal_fallback: true}
#   fast:    {provider: anthropic, model: claude-haiku-5-5, effort: low, max_tokens: 4000}

# --- OpenAI como principal ---
# providers: {openai: {enabled: true, api_key_env: OPENAI_API_KEY}}
# roles:
#   # Poner el modelo que tenga la cuenta (GET /v1/models). Los modelos de razonamiento no admiten `temperature`;
#   # `effort` se envía como `reasoning_effort`.
#   planner: {provider: openai, model: "<modelo>", max_tokens: 2048}
#   fast:    {provider: openai, model: "<modelo pequeño>", max_tokens: 1024}

# --- Bedrock como principal (cuando se active) ---
# data_mode: real
# providers: {bedrock: {enabled: true, region: us-east-1, allowed_data: real}, nvidia_nim: {enabled: false}}
# roles:
#   planner: {provider: bedrock, model: "<inference-profile sonnet>", temperature: 0.0}   # un solo modelo en el piloto
#   fast:    {provider: bedrock, model: "<inference-profile sonnet>", temperature: 0.0}
